<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POS-System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body style="margin: 0; padding: 0">

    <section class="navbar-section">
        <ul class="nav justify-content-center navbar">
            <li class="nav-item">
                <a class="nav-link active fw-bold" onclick="customerOnAc()" id="customer" aria-current="page" href="#">Customer</a>
            </li>
            <li class="nav-item">
                <a class="nav-link fw-bold" onclick="itemOnAc()" id="item" href="#">Item</a>
            </li>
            <li class="nav-item">
                <a class="nav-link fw-bold" onclick="orderOnAc()" id="order" href="#">Order</a>
            </li>
        </ul>

    </section>

    <section id="customer-section" class="p-5 col-12">
        <h1>Customer Form</h1>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="inputFirstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="inputFirstName" placeholder="Nimal">
            </div>
            <div class="col-md-6">
                <label for="inputLastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="inputLastName" placeholder="Perera">
            </div>
            <div class="col-12">
                <label for="inputAddress1" class="form-label">Address</label>
                <input type="text" class="form-control" id="inputAddress1" placeholder="1234 Main St">
            </div>
            <div class="col-12">
                <label for="contact" class="form-label">Contact</label>
                <input type="text" class="form-control" id="contact" placeholder="+9476">
            </div>

            <div>
                <button type="submit" class="btn btn-primary col-12" id="customer-save">Save Customer</button>
            </div>
        </form>

        <table class="table mt-5">
            <thead class="table-light">
                <th scope="col">#</th>
                <th scope="col">First-Name</th>
                <th scope="col">Last-Name</th>
                <th scope="col">Address</th>
                <th scope="col">Contact</th>
            </thead>
            <tbody id="tableCustomer">

            </tbody>
        </table>
    </section>

    <section id="item-section" class="p-5 col-12">
        <h1>Item Form</h1>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="item-name" class="form-label">Name</label>
                <input type="text" class="form-control" id="item-name">
            </div>
            <div class="col-md-6">
                <label for="item-description" class="form-label">Description</label>
                <input type="text" class="form-control" id="item-description">
            </div>
            <div class="col-12">
                <label for="item-qty" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="item-qty" placeholder="">
            </div>
            <div class="col-12">
                <label for="item-price" class="form-label">Price</label>
                <input type="number" class="form-control" id="item-price" placeholder="">
            </div>

            <button id="item-save" type="submit" class="btn btn-primary col-12">Save Item</button>

        </form>

        <table class="table mt-5 item-table">
            <thead class="table-light">
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Description</th>
            <th scope="col">Qty</th>
            <th scope="col">Price</th>
            </thead>
            <tbody id="item-tbody">

            </tbody>
        </table>
    </section>

    <section id="order-section" class="p-5 col-12">
        <h1>Order Form</h1>
        <form class="row g-3">
            <div class="col-md-6">
                <label for="customerId" class="form-label">Customer Id</label>
                <input type="text" class="form-control" id="customerId">
            </div>

            <div class="alert alert-danger" role="alert" id="customer-found">
               Customer Not Found.
            </div>

            <div class="col-md-6">
                <label for="itemId" class="form-label">Item Id</label>
                <input type="text" class="form-control" id="itemId">
            </div>

            <div class="alert alert-danger" role="alert" id="item-found">
                Item Not Found.
            </div>

            <div class="col-12">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity">
            </div>

            <div class="alert alert-danger" role="alert" id="itemQty-found">
                Invalid Item Quantity.
            </div>

            <div class="col-md-6">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date">
            </div>

            <button type="submit" class="btn btn-primary" id="save-order">Place Order</button>
        </form>

        <table class="table mt-5 order-table">
            <thead class="table-light">
            <th scope="col">#</th>
            <th scope="col">Customer</th>
            <th scope="col">Item</th>
            <th scope="col">Quantity</th>
            <th scope="col">Date</th>
            <th scope="col">Price</th>
            </thead>
            <tbody id="order-table">

            </tbody>
        </table>
    </section>

    <script src="lib/jquery-3.7.1.min.js"></script>
    <script src="main.js"></script>
    <script type="module" src="controller/CustomerController.js"></script>
    <script type="module" src="controller/ItemController.js"></script>
    <script type="module" src="controller/OrderController.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
